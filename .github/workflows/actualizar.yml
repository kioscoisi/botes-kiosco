name: Actualizar botes
on:
  schedule:
    - cron: "0 20 * * *"   # 22:00 en horario de verano de España
    - cron: "0 21 * * *"   # 22:00 en horario de invierno de España
    - cron: "5 * * * *"    # y cada hora, para pillar cambios tras los sorteos
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: botes
  cancel-in-progress: false
jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Leer botes de la web oficial
        run: python3 actualizar.py
      - name: Guardar si hay cambios
        run: |
          git config user.name "botes-bot"
          git config user.email "botes-bot@users.noreply.github.com"
          if [ -n "$(git status --porcelain botes.json)" ]; then
            git add botes.json
            git commit -m "Actualiza botes"
            git push
          fi
