name: Actualizar botes
on:
  # Programación desactivada: la web oficial responde 403 a los servidores de GitHub.
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: botes
  cancel-in-progress: false
jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Leer botes de la web oficial
        run: python3 actualizar.py
      - name: Guardar si hay cambios
        run: |
          git config user.name "botes-bot"
          git config user.email "botes-bot@users.noreply.github.com"
          if [ -n "$(git status --porcelain botes.json)" ]; then
            git add botes.json
            git commit -m "Actualiza botes"
            git push
          fi
